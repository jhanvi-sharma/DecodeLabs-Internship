<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Smart To Do List</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="container">
        <header>
            <button id="themeBtn">Dark Mode</button>
            <h1>TaskFlow</h1>
        </header>
        <form class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a task...">
            <input type="date" id="taskDate">
            <button id="addBtn" type="button">
                <i class="fa-solid fa-plus"></i>
            </button>
        </form>
        <section class="stats">
            <p>Total:<span id="totalTasks">0</span></p>
            <p>Completed:<span id="completedTasks">0</span></p>
            <p>Pending:<span id="pendingTasks">0</span></p>
            <p>Progress:<span id="progressPercent">0%</span></p>
        </section>
        <div class="filters">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
            <button class="filter-btn" data-filter="pending" type="button">Pending</button>
            <button id="clearAll" type="button">Clear All</button>
        </div>
        <ul id="taskList"></ul>
    </main>
    <script src="script.js"></script>
</body>
</html>
