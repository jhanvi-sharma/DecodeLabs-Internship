<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Smart To Do List</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <button id="themeBtn">Dark Mode</button>
        <h1>TaskFlow</h1>
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a task...">
            <input type="date" id="taskDate">
            <button id="addBtn">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        <div class="stats">
            <p>Total: <span id="totalTasks">0</span></p>
            <p>Completed:<span id="completedTasks">0</span></p>
            <p>Pending:<span id="pendingTasks">0</span></p>
            <p>Progress:<span id="progressPercent">0%</span></p>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button id="clearAll">Clear All</button>
        </div>
        <ul id="taskList"></ul>
    </div>
<script src="script.js"></script>
</body>
</html>
